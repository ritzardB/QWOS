[project]
name = "qwos"
version = "0.1.0"
description = "Quantum Workforce OS Backend API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

keywords = [
    "workforce",
    "human-resources",
    "virtual-assistant",
    "saas",
    "fastapi",
    "postgresql",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

authors = [
    { name = "Richard Balabarcon" }
]

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41",
    "alembic>=1.16.4",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "bcrypt>=5.0.0",
    "python-ulid>=4.0.1",
    "email-validator>=2.3.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "black>=25.1.0",
    "mypy>=1.17.0",
    "httpx2>=2.10.0",
]

ocr = [
    "paddleocr>=3.7.0,<4.0.0",
    "paddlepaddle>=3.0.0",
]

docs = [
    "mkdocs",
    "mkdocs-material",
]

# Leave out [project.urls]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.coverage.run]
source = ["src/qwos"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwos"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
